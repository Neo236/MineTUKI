name: Publicar updater

# Se dispara al empujar una etiqueta packwarden-vX.Y.Z. No corre en push a
# main: el commit que este mismo workflow deja no debe volver a dispararlo.
on:
  push:
    tags: ['packwarden-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar, por ejemplo packwarden-v2.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Compilar, publicar y actualizar el pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Instalar packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Resolver etiqueta y version
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#packwarden-v}"
          declared=$(grep -E '^mod_version=' updater/gradle.properties | cut -d= -f2)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$declared" ]; then
            echo "::error::La etiqueta dice $version pero gradle.properties dice $declared."
            exit 1
          fi

      - name: Compilar
        working-directory: updater
        run: ./gradlew build installerZip

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="updater/build/libs/packwarden-${{ steps.meta.outputs.version }}.jar"
          zip="updater/build/distributions/MineTUKI-instalador.zip"

          # Idempotente a proposito: si el release ya existe se reemplazan sus
          # archivos en vez de fallar, para poder reintentar una publicacion sin
          # tener que inventar un numero de version nuevo.
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "El release ya existe; se actualizan sus archivos."
            gh release upload "${{ steps.meta.outputs.tag }}" "$jar" "$zip" --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" "$jar" "$zip" \
              --title "PackWarden ${{ steps.meta.outputs.version }}" \
              --generate-notes --latest
          fi

      - name: Guardar el companion para el ejecutable de Windows
        uses: actions/upload-artifact@v4
        with:
          name: companion
          path: |
            updater/build/libs/*-companion.jar
            updater/build/packwiz/packwiz-installer-bootstrap.jar
          if-no-files-found: error

      - name: Apuntar el pack a la version nueva
        run: |
          jar="packwarden-${{ steps.meta.outputs.version }}.jar"
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${jar}"
          hash=$(sha256sum "updater/build/libs/${jar}" | cut -d' ' -f1)

          # Se reescribe el metadato a mano en vez de usar 'packwiz url add':
          # el release recien publicado puede tardar en estar disponible, y
          # el hash ya lo tenemos del artefacto que acabamos de compilar.
          cat > mods/packwarden.pw.toml <<EOF
          name = "PackWarden"
          filename = "${jar}"
          side = "both"

          [download]
          url = "${url}"
          hash-format = "sha256"
          hash = "${hash}"
          EOF

          packwiz refresh

      - name: Commitear el pack actualizado
        run: |
          if git diff --quiet -- pack.toml index.toml mods/packwarden.pw.toml; then
            echo "El pack ya apuntaba a esta version."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pack.toml index.toml mods/packwarden.pw.toml
          git commit -m "chore: apuntar el pack a PackWarden ${{ steps.meta.outputs.version }}"
          git push origin main

  windows-exe:
    name: Ejecutable de Windows
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: companion
          path: artefactos

      - name: Resolver etiqueta y version
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # La version tambien: jpackage la exige, y sin ella el paso falla con
          # "Version may not be empty string".
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#packwarden-v}" >> "$GITHUB_OUTPUT"

      - name: Armar la aplicacion
        shell: bash
        run: |
          mkdir -p entrada
          cp artefactos/libs/*-companion.jar entrada/packwarden-companion.jar
          cp artefactos/packwiz/packwiz-installer-bootstrap.jar entrada/

          # jpackage empaqueta un Java propio, asi que corre en cualquier maquina
          # sin que haya nada instalado.
          jpackage \
            --type app-image \
            --name "MineTUKI" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --input entrada \
            --main-jar packwarden-companion.jar \
            --main-class io.github.neo236.packwarden.companion.CompanionMain \
            --dest salida \
            --icon updater/src/installer/icono.ico \
            --java-options "-Dfile.encoding=UTF-8" \
            --arguments "--install" \
            --arguments "--pack-name" --arguments "MineTUKI" \
            --arguments "--title" --arguments "NeoTUKI Mod Updater" \
            --arguments "--command-alias" --arguments "tuki" \
            --arguments "--pack-url" --arguments "https://minetuki-neo236s-projects.vercel.app/pack.toml" \
            --arguments "--fallback-url" --arguments "https://raw.githubusercontent.com/Neo236/MineTUKI/main/pack.toml" \
            --arguments "--neoforge-version" --arguments "neoforge-21.1.248" \
            --arguments "--folder-name" --arguments "minetuki" \
            --arguments "--bootstrap" --arguments "packwiz-installer-bootstrap.jar"

          # El bootstrap va al lado del ejecutable: la ruta que recibe es relativa
          # al directorio de trabajo del proceso.
          cp entrada/packwiz-installer-bootstrap.jar "salida/MineTUKI/"

      - name: Empaquetar en un unico ejecutable
        shell: bash
        run: |
          # Un solo archivo que no hay que descomprimir y que no instala nada:
          # se descomprime solo en una carpeta temporal, corre, y desaparece.
          # El modulo que lo permite es codigo de terceros, asi que va fijado por
          # version y verificado por hash.
          url="https://www.7-zip.org/a/7z2501-extra.7z"
          esperado="cd3cf38085c2cc6839cf72716dafb3175ae425f4fd34faafc6c0b64d618d307f"

          curl -sL -o 7zextra.7z "$url"
          obtenido=$(sha256sum 7zextra.7z | cut -d' ' -f1)
          if [ "$obtenido" != "$esperado" ]; then
            echo "::error::El hash de 7-Zip extra no coincide."
            echo "  esperado: $esperado"
            echo "  obtenido: $obtenido"
            exit 1
          fi

          7z x 7zextra.7z -o7zextra -y >/dev/null
          sfx=$(find 7zextra -name '7zS.sfx' | head -1)
          if [ -z "$sfx" ]; then
            echo "::error::No se encontro el modulo 7zS.sfx."
            exit 1
          fi

          cd salida && 7z a -t7z -mx=7 ../aplicacion.7z MineTUKI >/dev/null && cd ..

          printf ';!@Install@!UTF-8!\r\nTitle="MineTUKI"\r\nRunProgram="MineTUKI\\MineTUKI.exe"\r\n;!@InstallEnd@!\r\n' > config.txt

          cat "$sfx" config.txt aplicacion.7z > MineTUKI-instalador.exe
          ls -la MineTUKI-instalador.exe

      - name: Subirlo al release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" MineTUKI-instalador.exe --clobber
