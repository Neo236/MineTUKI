plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Para las dependencias del companion, que se compila fuera del entorno de
    // Minecraft y por lo tanto no hereda sus repositorios.
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Los valores de gradle.properties se sustituyen en la metadata del mod, para
// no tener el numero de version escrito en dos lugares.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:all" << "-Xlint:-processing"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// Companion: el ejecutable que hace el trabajo con Minecraft ya cerrado.
//
// Vive en su propio source set, sin nada de Minecraft en el classpath, porque
// tiene que poder correr solo. Se empaqueta dentro del mod como recurso, junto
// con el bootstrap de packwiz, para no depender de descargas en tiempo de uso.
// ---------------------------------------------------------------------------

configurations {
    // El companion necesita un parser JSON de verdad: al registrar el perfil en el
    // launcher tiene que reescribir launcher_profiles.json sin perder ni un campo
    // de los perfiles que el jugador ya tenga.
    companionDeps
}

dependencies {
    companionDeps 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    companion {
        java.srcDirs = ['src/companion/java']
        compileClasspath = configurations.companionDeps
        runtimeClasspath = configurations.companionDeps
    }
}

// El companion se compila para Java 17 y no para 21 como el mod.
//
// El instalador corre ANTES de que el jugador haya abierto nunca un perfil
// 1.21, asi que el launcher todavia puede no haber descargado su runtime de
// Java 21: lo normal es que solo tenga java-runtime-gamma, que es 17.
// Compilado a 21, en esas maquinas moria con UnsupportedClassVersionError.
tasks.named('compileCompanionJava') {
    options.release = 17
}

// Fijado a una version concreta y verificado por hash: es codigo de terceros que
// se va a ejecutar en las maquinas de los jugadores.
def packwizBootstrapUrl =
        'https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar'
def packwizBootstrapSha256 = 'a8fbb24dc604278e97f4688e82d3d91a318b98efc08d5dbfcbcbcab6443d116c'
def packwizBootstrapFile = layout.buildDirectory.file('packwiz/packwiz-installer-bootstrap.jar')

tasks.register('downloadPackwizBootstrap') {
    description = 'Descarga el bootstrap de packwiz y verifica su hash.'
    outputs.file(packwizBootstrapFile)
    def url = packwizBootstrapUrl
    def expected = packwizBootstrapSha256
    def output = packwizBootstrapFile
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists()) {
            new URL(url).withInputStream { input ->
                target.withOutputStream { out -> out << input }
            }
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(target.bytes)
                .encodeHex()
                .toString()
        if (actual != expected) {
            target.delete()
            throw new GradleException(
                    "El hash del bootstrap de packwiz no coincide.\n" +
                    "  esperado: ${expected}\n" +
                    "  obtenido: ${actual}")
        }
    }
}

tasks.register('companionJar', Jar) {
    archiveClassifier = 'companion'
    from sourceSets.companion.output
    // Tiene que ser autocontenido: se ejecuta suelto, fuera del juego.
    from {
        configurations.companionDeps.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    manifest {
        attributes('Main-Class': 'io.github.neo236.packwarden.companion.CompanionMain')
    }
}

tasks.named('processResources') {
    dependsOn 'companionJar', 'downloadPackwizBootstrap'
    from(tasks.named('companionJar').flatMap { it.archiveFile }) {
        into 'packwarden'
        rename { 'companion.jar' }
    }
    from(packwizBootstrapFile) {
        into 'packwarden'
    }
}

// Paquete que se le manda a los jugadores: el companion, el bootstrap de
// packwiz y un lanzador por sistema operativo que sabe encontrar Java.
tasks.register('installerZip', Zip) {
    dependsOn 'companionJar', 'downloadPackwizBootstrap'
    archiveFileName = 'MineTUKI-instalador.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')

    into('MineTUKI-instalador') {
        from(tasks.named('companionJar').flatMap { it.archiveFile }) {
            rename { 'packwarden-companion.jar' }
        }
        from(packwizBootstrapFile)
        from("src/installer") {
            exclude "icono.ico"
            // Los scripts de shell tienen que quedar ejecutables al descomprimir.
            // En Gradle 9 la propiedad 'mode' ya no existe.
            filesMatching('*.command') { details ->
                details.permissions { permissions -> permissions.unix('rwxr-xr-x') }
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Tests. Cubren la logica pura: parseo, comparaciones y generacion de archivos.
// Es justo donde aparecieron los errores que solo se vieron al ejecutar.
// ---------------------------------------------------------------------------

sourceSets {
    companionTest {
        java.srcDirs = ["src/companionTest/java"]
        // Con "+=" en vez de "=" para no perder las dependencias declaradas
        // despues, que es donde entran JUnit y Gson.
        compileClasspath += sourceSets.companion.output
        runtimeClasspath += sourceSets.companion.output
    }
}

configurations {
    companionTestImplementation.extendsFrom companionDeps
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // El classpath de compilacion las trae desde Minecraft, pero el de ejecucion
    // de los tests no: sin esto las clases del nucleo no llegan a inicializarse.
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'

    companionTestImplementation platform('org.junit:junit-bom:5.11.3')
    companionTestImplementation 'org.junit.jupiter:junit-jupiter'
    companionTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

tasks.register('companionTest', Test) {
    description = 'Tests del instalador, que no necesita Minecraft.'
    testClassesDirs = sourceSets.companionTest.output.classesDirs
    classpath = sourceSets.companionTest.runtimeClasspath
    // Los lanzadores son archivos de texto que no compila nadie, asi que hay
    // pruebas que los leen tal cual se entregan. Lo mismo con las fuentes, para
    // cotejar cada texto que pide el codigo contra los dos idiomas.
    systemProperty 'installer.scripts', file('src/installer').absolutePath
    systemProperty 'companion.sources', file('src/companion/java').absolutePath
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

tasks.named('check') {
    dependsOn 'companionTest'
}
