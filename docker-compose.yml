services:
  mc:
    image: itzg/minecraft-server
    container_name: minetuki
    restart: unless-stopped
    stop_grace_period: 60s
    # Hard cap at the cgroup/Docker level - MEMORY below only bounds the JVM
    # heap (-Xmx), not off-heap/native usage (Distant Horizons, Create,
    # Sable's physics engine, etc.), and this host runs ~13 other containers
    # that shouldn't get starved if Minecraft's off-heap usage balloons.
    mem_limit: "${MC_MEM_LIMIT:-10g}"
    memswap_limit: "${MC_MEM_LIMIT:-10g}"
    ports:
      - "25565:25565"
      # RCON (optional remote console) - only exposed if you set ENABLE_RCON below
      # - "25575:25575"
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"

      # Pulls pack.toml straight from this repo's main branch and installs
      # only the mods marked side="server" or side="both" - the same
      # mechanism friends use client-side, just filtered the other way.
      PACKWIZ_URL: "https://raw.githubusercontent.com/Neo236/MineTUKI/main/pack.toml"

      MEMORY: "${MC_MEMORY:-8G}"
      MOTD: "${MC_MOTD:-MineTUKI}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      ALLOW_FLIGHT: "TRUE"

      # Whitelist is on (white-list=true set directly in server.properties -
      # deliberately NOT managed via the WHITELIST/ENFORCE_WHITELIST env vars
      # here: itzg's image treats an empty env value as "clear this
      # property", which fights an empty-but-enabled whitelist). Add players
      # with: docker exec -u 1000 minetuki mc-send-to-console whitelist add <username>
      CREATE_CONSOLE_IN_PIPE: "TRUE"

      # Set to a real password in .env to enable remote console access.
      ENABLE_RCON: "${MC_ENABLE_RCON:-FALSE}"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-}"

      # World-heavy modpack (Distant Horizons, Terralith, etc.) - give the
      # server more time to generate/load before health-checking it.
      TZ: "${MC_TZ:-America/Argentina/Buenos_Aires}"
    volumes:
      - /home/neo236/deployments/minecraft/mainMinecraftServer:/data
